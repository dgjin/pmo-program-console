# /etc/nginx/conf.d/pmo.conf
# 把 pmo.example.internal 换成内网域名，证书路径换成实际路径。
server {
    listen 80;
    server_name pmo.example.internal;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name pmo.example.internal;

    ssl_certificate     /etc/nginx/certs/pmo.crt;
    ssl_certificate_key /etc/nginx/certs/pmo.key;

    client_max_body_size 2m;

    location / {
        proxy_pass http://127.0.0.1:5177;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 60s;

        # 应用本身已设置 HttpOnly / SameSite，这里补 Secure
        proxy_cookie_flags pmo_sid secure httponly samesite=lax;
    }
}
