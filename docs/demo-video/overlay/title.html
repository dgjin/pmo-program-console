<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>PMO 项目群控制台 · 完整系统演示</title>
<style>
  :root { --delta: 0s; --bg: #09111f; --fg: #edf4ff; --dim: #9bacc7; --accent: #64d6c5; --blue: #75a7ff; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 1920px; height: 1080px; overflow: hidden; }
  body { background: var(--bg); color: var(--fg); font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif; }
  body::before { content: ""; position: fixed; inset: 0; background: radial-gradient(circle at 76% 22%, rgba(100,214,197,.16), transparent 35%), radial-gradient(circle at 18% 78%, rgba(117,167,255,.13), transparent 38%), linear-gradient(rgba(255,255,255,.018) 1px, transparent 1px), linear-gradient(90deg, rgba(255,255,255,.018) 1px, transparent 1px); background-size: auto, auto, 48px 48px, 48px 48px; }
  .stage { position: relative; width: 100%; height: 100%; padding: 116px 142px; display: flex; flex-direction: column; justify-content: center; }
  .eyebrow { color: var(--accent); font-size: 22px; letter-spacing: 8px; font-weight: 650; }
  h1 { margin-top: 28px; max-width: 1280px; font-size: 92px; line-height: 1.15; letter-spacing: 2px; }
  h1 span { color: var(--accent); }
  .lead { margin-top: 30px; color: var(--dim); font-size: 32px; letter-spacing: 3px; }
  .flow { display: grid; grid-template-columns: repeat(4, 1fr); gap: 22px; margin-top: 76px; }
  .step { position: relative; min-height: 176px; padding: 28px 30px; border: 1px solid rgba(155,172,199,.2); border-radius: 20px; background: rgba(17,30,50,.78); }
  .step b { display: block; color: var(--blue); font-size: 18px; letter-spacing: 3px; }
  .step strong { display: block; margin-top: 20px; font-size: 30px; }
  .step span { display: block; margin-top: 12px; color: var(--dim); font-size: 20px; }
  .notice { margin-top: 46px; display: inline-flex; align-self: flex-start; padding: 14px 22px; border-left: 3px solid var(--accent); background: rgba(100,214,197,.07); color: #c9d8e9; font-size: 21px; letter-spacing: 1px; }
  .anim { opacity: 0; transform: translateY(20px); }
  body.playing .anim { animation: rise .8s cubic-bezier(.2,.7,.2,1) forwards; animation-delay: calc(var(--d,0s) - var(--delta)); }
  @keyframes rise { to { opacity: 1; transform: none; } }
  #veil { position: fixed; inset: 0; z-index: 99; pointer-events: none; background: var(--bg); opacity: 1; transition: opacity .8s ease .5s; }
  body.playing #veil { opacity: 0; }
  .dv-cursor { display: none !important; }
</style>
</head>
<body>
  <main class="stage">
    <div class="eyebrow anim" style="--d:.3s">PROGRAM CONTROL OFFICE</div>
    <h1 class="anim" style="--d:1.0s">PMO 项目群控制台<br><span>完整系统演示</span></h1>
    <p class="lead anim" style="--d:11.4s">项目填报 · PMO 审核 · 自动汇总 · 治理分析</p>
    <section class="flow">
      <div class="step anim" style="--d:12.0s"><b>01</b><strong>项目执行</strong><span>计划、风险与里程碑</span></div>
      <div class="step anim" style="--d:12.6s"><b>02</b><strong>填报审核</strong><span>草稿、版本与审核闭环</span></div>
      <div class="step anim" style="--d:13.2s"><b>03</b><strong>项目群汇总</strong><span>周报、计划与历史快照</span></div>
      <div class="step anim" style="--d:13.8s"><b>04</b><strong>智能治理</strong><span>AI、知识与运维保障</span></div>
    </section>
    <div class="notice anim" style="--d:5.2s">隔离演示环境 · 所有项目与填报内容均为演示数据</div>
  </main>
  <div id="veil"></div>
</body>
</html>
